<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDIVID</title>
  <meta name="description" content="Monteur vidéo IA local : déposez vos rushs, le LLM propose un montage rythmé, vous l'ajustez en discutant.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23bf0063'/%3E%3Cpath d='M11 9l13 7-13 7z' fill='white'/%3E%3C/svg%3E">
  <script>
    // Thème (contrat de design KARAYAN, R-03) : data-theme posé avant l'affichage, clé karayan_theme,
    // préférence du système par défaut.
    (function () {
      var t = null;
      try { t = localStorage.getItem('karayan_theme'); } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
    })();
  </script>
  <link rel="stylesheet" href="/design/karayan.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <div id="app" aria-live="polite"></div>
  <div id="toasts" role="status"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
